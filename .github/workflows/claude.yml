name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The repo CLAUDE.md (the federation constitution) governs behavior.
          claude_args: |
            --max-turns 40
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh pr create:*)",
                  "Bash(gh pr view:*)",
                  "Bash(gh pr diff:*)",
                  "Bash(gh issue view:*)",
                  "Bash(gh issue comment:*)",
                  "Bash(gh issue edit:*)",
                  "Bash(pip install:*)",
                  "Bash(pytest:*)",
                  "Bash(python3:*)"
                ]
              }
            }
        env:
          GH_TOKEN: ${{ github.token }}
